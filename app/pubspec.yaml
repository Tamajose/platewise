name: platewise
description: Compare meals before eating and keep a private nutrition log.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.14.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: 1.11.1
  flutter_riverpod: 3.5.0
  go_router: 18.1.4
  supabase_flutter: 2.18.3
  image_picker: 1.2.4
  image: 4.13.1
  http: 1.6.0
  http_parser: 4.1.2
  shared_preferences: 2.5.6
  timezone: 0.11.2
  intl: 0.20.3
  uuid: 4.6.0
  record: 7.2.0
  geolocator: 14.1.2
  flutter_map: 8.3.2
  latlong2: 0.10.1
  url_launcher: 6.3.3
  fl_chart: 1.3.1
  path_provider: 2.1.6
  cross_file: 0.3.5+5

dev_dependencies:
  flutter_test:
    sdk: flutter
  shared_preferences_platform_interface: 2.4.2
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
    - assets/fonts/DMSerifText-OFL.txt
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/NotoSansBengali-OFL.txt
  fonts:
    - family: DM Serif Text
      fonts:
        - asset: assets/fonts/DMSerifText-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali.ttf
