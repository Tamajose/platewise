name: PlateWise checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  # A trivial always-green check that keeps the workflow valid on any change.
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: echo "Repository foundation in place."
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: deno fmt --check --config supabase/functions/deno.json supabase/functions tools/evaluate.ts tools/metrics.ts
      - run: deno lint --config supabase/functions/deno.json supabase/functions tools/evaluate.ts tools/metrics.ts
      - run: deno check --config supabase/functions/deno.json supabase/functions/platewise/index.ts tools/evaluate.ts tools/metrics.ts
      - run: deno test --allow-env --allow-read --config supabase/functions/deno.json supabase/functions
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.76.15
      - run: supabase start -x studio,mailpit,imgproxy,logflare,vector,realtime,supavisor,postgres-meta,edge-runtime
      - run: |
          psql postgresql://postgres:postgres@localhost:54322/postgres -f supabase/tests/core.sql
          psql postgresql://postgres:postgres@localhost:54322/postgres -f supabase/tests/privacy.sql
