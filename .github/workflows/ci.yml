name: PlateWise checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  # Placeholder so the workflow is valid while the repository is assembled.
  # Real jobs are added by the steps that introduce their code:
  #   backend database (B1), backend Deno checks (B2), app (F1).
  #   B3 and B4 extend the functions job as their files land.
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: echo "Repository foundation in place."
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: deno fmt --check --config supabase/functions/deno.json supabase/functions
      - run: deno lint --config supabase/functions/deno.json supabase/functions
      # Entry points are listed explicitly until the handler lands (B4).
      - run: >-
          deno check --config supabase/functions/deno.json
          supabase/functions/_shared/contracts.ts
          supabase/functions/_shared/providers.ts
          supabase/functions/_shared/http.ts
          supabase/functions/_shared/privacy.ts
          supabase/functions/_shared/progress.ts
      - run: deno test --allow-env --config supabase/functions/deno.json supabase/functions/_shared
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.76.15
      - run: supabase start -x studio,mailpit,imgproxy,logflare,vector,realtime,supavisor,postgres-meta,edge-runtime
      - run: |
          psql postgresql://postgres:postgres@localhost:54322/postgres -f supabase/tests/core.sql
          psql postgresql://postgres:postgres@localhost:54322/postgres -f supabase/tests/privacy.sql
